name: CI Pipeline

on: push

jobs:
    project-testing:
        runs-on: ubuntu-latest

        steps:
            - name: checkout code
              uses: actions/checkout@v4

            - name: setup python
              uses: actions/setup-python@v5
              with:
                python-version: '3.11' 
                cache: "pip" 

            - name: install dependencies
              run: |
                python -m pip install --upgrade pip
                pip install -r requirements.txt

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v4
              with:
                aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                aws-region: ap-south-1  
                    
            - name: Pull DVC data
              run: |
                dvc pull    
                
            - name: run pipeline
              env:
                DAGSHUB_PAT: ${{ secrets.DAGSHUB_PAT }}
              run: |
                dvc repro  
                
            - name: model register test and performance
              env:
                DAGSHUB_PAT: ${{ secrets.DAGSHUB_PAT }}
              run: |
                pytest tests/test_models.py    

            - name: promote model to production
              if: success()
              env:
                DAGSHUB_PAT: ${{ secrets.DAGSHUB_PAT }}
              run: |
                python scripts/promote.py     

            - name: Run Flask app tests
              if: success()
              env:
                DAGSHUB_PAT: ${{ secrets.DAGSHUB_PAT }}
              run: |
                pytest tests/test_flask_app.py       

            - name: Login to AWS ECR
              if: success()
              run: |
                aws ecr get-login-password --region ap-south-1 | docker login --username AWS --password-stdin 501315282159.dkr.ecr.ap-south-1.amazonaws.com

            - name: Build Docker image
              run: |
                docker build -t mlop_ecr .    

            - name: Tag your image so you can push the image to this repository    
              run: |
                docker tag mlop_ecr:latest 501315282159.dkr.ecr.ap-south-1.amazonaws.com/mlop_ecr:latest
            
            - name: Push this image to your newly created AWS repository
              run: |
                docker push 501315282159.dkr.ecr.ap-south-1.amazonaws.com/mlop_ecr:latest

            - name: Deploy on EC2
              uses: appleboy/ssh-action@v1.2.0
              with:
                host: ${{ secrets.EC2_HOST }}
                username: ec2-user
                key: ${{ secrets.EC2_SSH_KEY }}
                script: |
                  aws ecr get-login-password --region ap-south-1 | docker login --username AWS --password-stdin 501315282159.dkr.ecr.ap-south-1.amazonaws.com

                  docker pull 501315282159.dkr.ecr.ap-south-1.amazonaws.com/mlop_ecr:latest

                  docker stop my-app || true
                  docker rm my-app || true

                  docker run -d \
                    --name my-app \
                    --restart unless-stopped \
                    -p 80:3000 \
                    501315282159.dkr.ecr.ap-south-1.amazonaws.com/mlop_ecr:latest 